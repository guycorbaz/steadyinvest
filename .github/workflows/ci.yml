name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux-only for now (decision 2026-06-09). Re-add macos-latest / windows-latest here to
        # restore the cross-OS matrix when multi-OS support is back in scope.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Slint Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27 (pinned by SHA)
        with:
          toolchain: "1.96"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --all --locked

      # Determinism hash (Linux-only for now; the test stays the cross-OS contract for when the
      # macOS/Windows matrix is restored — exact decimal makes it deterministic by construction).
      - name: Determinism hash
        run: |
          cargo test -p steadyinvest-core --locked tests::determinism_hash_matches_cross_os_contract -- --exact
          cargo test -p steadyinvest-core --test spike_c_cagr_precision --locked

  license-audit:
    name: License audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27 (pinned by SHA)
        with:
          toolchain: "1.96"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check
