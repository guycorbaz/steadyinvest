# cargo-deny configuration (CI gate: `cargo deny check`).
# Enforces the GPL-3.0 license posture: every dependency must carry a GPL-3.0-compatible license.
# Apache-2.0 is one-way GPL-3.0-compatible; MIT/BSD/ISC/Zlib/Unicode are permissive and fine.

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "GPL-3.0",
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
