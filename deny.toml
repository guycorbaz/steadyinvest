# cargo-deny configuration (CI gate: `cargo deny check`).
# Enforces the GPL-3.0 license posture: every dependency must carry a GPL-3.0-compatible license.
# Apache-2.0 is one-way GPL-3.0-compatible; MIT/BSD/ISC/Zlib/Unicode are permissive and fine.

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "GPL-3.0",
    "GPL-3.0-only",                   # Slint family declares GPL-3.0-only (satisfies its OR expression)
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",                        # Boost license (clipboard-win/error-code on Windows) — permissive, GPL-compatible
    "NCSA",                           # University of Illinois/NCSA (libfuzzer-sys via ravif) — permissive, GPL-compatible
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",            # Mozilla webpki cert bundle (webpki-roots/-root-certs) — Story 3.1 TLS; permissive data license, GPL-compatible
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true        # internal workspace crates are path deps with no version — that's fine

[advisories]
version = 2
yanked = "deny"
# Only flag unmaintained advisories for our own crates, not deep transitive build deps we can't
# control (e.g. `paste` RUSTSEC-2024-0436, pulled in by Slint's image/rav1e stack). Vulnerabilities
# are still denied by default.
unmaintained = "workspace"
ignore = [
    # quick-xml 0.39.4 XML-parsing DoS (quadratic duplicate-attribute check / unbounded xmlns
    # allocation). Reached ONLY via wayland-scanner (→ smithay-client-toolkit → Slint's Wayland
    # backend) and zbus-lockstep — both are BUILD-TIME code generators parsing their own vendored,
    # trusted protocol XML; no untrusted XML ever reaches quick-xml at runtime in this app. No
    # semver-compatible fix exists (the fix is 0.41, wayland-scanner pins 0.39.x) — remove these
    # ignores when the Slint/smithay stack bumps (tracked in issue #83).
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
