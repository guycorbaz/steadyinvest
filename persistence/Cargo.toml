[package]
name = "steadyinvest-persistence"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Local SQLite journal (hybrid model). The only crate that touches SQLite."

[dependencies]
steadyinvest-contract = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

# The dossier file identity on Windows (Story 8.3 A11): an open handle is safe there. On Unix the
# identity is a stat(2) — no descriptor, which would release this process's SQLite locks.
[target.'cfg(not(unix))'.dependencies]
same-file = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
