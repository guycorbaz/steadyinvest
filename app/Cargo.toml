[package]
name = "steadyinvest-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Thin Slint desktop UI (charts native Slint; no web, no egui)."
default-run = "steadyinvest-app"

[[bin]]
name = "steadyinvest-app"
path = "src/main.rs"

[dependencies]
steadyinvest-core = { workspace = true }
steadyinvest-contract = { workspace = true }
steadyinvest-ingestion = { workspace = true }
steadyinvest-persistence = { workspace = true }
steadyinvest-report = { workspace = true }
slint = { workspace = true }
tokio = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Per-crate error enum (ADD15) for the keychain cause taxonomy (Story 3.2). Already in the lock
# tree via core/ingestion, so promoting it to the app adds nothing to Cargo.lock.
thiserror = { workspace = true }
# Identity + time are injected (ADD15): `uuid` (v4) and `chrono` (RFC3339 UTC) are the ONLY
# sources of UUIDs / wall-clock timestamps in the app, funnelled through `clock.rs`.
uuid = { workspace = true }
chrono = { workspace = true }
# Exact-decimal parsing for the locale-aware entry path (Story 2.4): `Decimal::from_str_exact`
# turns a user's locale string into a `contract::Money`. Already in the tree (contract depends on
# it), so promoting it from dev-only adds nothing to `Cargo.lock`. NEVER `f64` (Cardinal Rule).
rust_decimal = { workspace = true }
# Clipboard read for the production paste-a-column (Story 2.4): promoted from a dev-only example
# dependency to a real runtime dependency (text-only, `default-features = false`). Its sole
# Windows transitive `clipboard-win` (BSL-1.0) is already allow-listed in `deny.toml` (Spike A).
arboard = { workspace = true }
# OS keychain for provider API keys (Story 3.2): keyring 3.x, async-secret-service backend with the
# async-io runtime (pinned in the workspace; async-io avoids the tokio main-thread deadlock). `app`
# is the ONLY crate that touches it — the key is injected into `ingestion`, never read there
# (FR63 / architecture invariant).
keyring = { workspace = true }
# Native OS file dialogs for the journal-location picker (Story 5.5, FR66) — open/create/pick a
# journal `.db` + directory. xdg-portal backend (no GTK system dep; reuses zbus from keyring).
rfd = { workspace = true }

[dev-dependencies]
# Config tests write to temp paths only — never the real config dir.
tempfile = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }
