[package]
name = "steadyinvest-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Thin Slint desktop UI (charts native Slint; no web, no egui)."
default-run = "steadyinvest-app"

[[bin]]
name = "steadyinvest-app"
path = "src/main.rs"

[dependencies]
steadyinvest-core = { workspace = true }
steadyinvest-contract = { workspace = true }
steadyinvest-ingestion = { workspace = true }
steadyinvest-persistence = { workspace = true }
steadyinvest-report = { workspace = true }
slint = { workspace = true }
tokio = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# keyring (OS keychain) is added in Story 3.2 once the correct credential crate is selected.

[dev-dependencies]
# Used only by the throwaway Story-1.5 chart spike example (signal recompute in exact decimal).
rust_decimal = { workspace = true }
# Used only by the throwaway Story-1.4 grid spike example (paste-a-column clipboard read).
arboard = { workspace = true }
# Config tests write to temp paths only — never the real config dir.
tempfile = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }
