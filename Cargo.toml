# steadyinvest — Cargo workspace.
# Thin Slint UI over a UI-independent, deterministic, tested calculation core.
# Single source of dependency versions lives in [workspace.dependencies] below.

[workspace]
resolver = "2"
members = ["core", "contract", "ingestion", "persistence", "report", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.96"          # MSRV — pinned deps (Slint 1.16, libsqlite3-sys 0.38 cfg_select!) require a recent stable
authors = ["Guy"]
repository = "https://github.com/guycorbaz/steadyinvest"

[workspace.dependencies]
# ── Internal crates (version pinned so they are not wildcard deps) ──
steadyinvest-core = { path = "core", version = "0.1.0" }
steadyinvest-contract = { path = "contract", version = "0.1.0" }
steadyinvest-ingestion = { path = "ingestion", version = "0.1.0" }
steadyinvest-persistence = { path = "persistence", version = "0.1.0" }
steadyinvest-report = { path = "report", version = "0.1.0" }

# ── External (pinned; latest stable verified 2026-06) ──
slint = "1.16"
slint-build = "1.16"
rusqlite = { version = "0.40", features = ["bundled"] }       # SQLite compiled into the binary
rust_decimal = { version = "1.42", features = ["maths"] }     # exact decimal + powd/exp/ln (no f64)
# reqwest TLS backend deferred to Story 3.1 (first HTTP). REVALIDATED 2026-06-15 (#5/B5): in 0.13 the
# TLS feature names have CHANGED — the old `rustls-tls`/`rustls-tls-webpki-roots` are GONE. Current
# features: `rustls-no-provider`, `rustls-native-certs`, `webpki-roots` (full TLS set: native-tls*,
# rustls-native-certs, rustls-no-provider, webpki-roots, socks, stream, zstd, query). The pure-Rust,
# no-cmake path for 3.1 = `rustls-no-provider` + install the `ring` CryptoProvider in code (avoids the
# default aws-lc-rs/cmake), with `webpki-roots` (or `rustls-native-certs`) for roots. Activate then.
# Story 3.1 ACTIVATED the TLS backend (#5/B5): `rustls-no-provider` (rustls without a bundled crypto
# provider — we install `ring` below, avoiding the default aws-lc-rs/cmake) + `webpki-roots` (bundled
# Mozilla roots → no system cert store dependency, portable single binary).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "webpki-roots"] }
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros"] }
# Pure-Rust rustls + the `ring` crypto provider (no aws-lc-rs, no cmake). Must match reqwest 0.13's
# rustls (0.23) so the process-default provider installed via `ingestion::install_crypto_provider()`
# applies to reqwest's TLS. default-features off drops the aws-lc-rs default.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
tracing = "0.1"
# NOTE: `keyring` is intentionally NOT pinned here yet. The crates.io `keyring` 4.0.x is NOT the
# expected credential library (it pulls a turso/tantivy/dbus keystore stack). REVALIDATED 2026-06-15
# (#5/B5): `keyring = "3"` with `--no-default-features --features linux-native` resolves lean (enables
# only the kernel keyutils backend, drops async/sync-secret-service). Add in Story 3.2. Decision for
# 3.2: `linux-native` (keyutils) is session-scoped; `sync-secret-service` (dbus gnome-keyring/KWallet)
# is the persistent-across-reboot option — pick per the "keys survive restart" requirement.
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
# RFC3339 UTC wall clock for the app's injected `Clock` (ADD15). `clock` feature only — no civil
# math is hand-rolled. Already in the lock tree transitively via Slint (default-features off keeps
# the edge minimal: the `clock` feature's deps — incl. iana-time-zone — are already present), so
# adding it to `app` is a single new edge, no new crates. MIT/Apache (already in deny.toml allow).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.11"
# Dev-only (persistence tests): test DBs land in /tmp, outside the Synology Drive sync watch.
tempfile = "3"
# Clipboard read — used ONLY by the throwaway Story-1.4 grid spike (paste-a-column). Text-only
# (`default-features = false` drops image-data deps) to keep the tree lean. deny.toml already allows
# its Windows backend's BSL-1.0 (clipboard-win). Not a shipping dependency.
arboard = { version = "3", default-features = false }

# Build artifacts are smaller/faster to ship for a desktop app.
[profile.release]
lto = "thin"
strip = true
