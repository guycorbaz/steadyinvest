# steadyinvest — Cargo workspace.
# Thin Slint UI over a UI-independent, deterministic, tested calculation core.
# Single source of dependency versions lives in [workspace.dependencies] below.

[workspace]
resolver = "2"
members = ["core", "contract", "ingestion", "persistence", "report", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.96"          # MSRV — pinned deps (Slint 1.16, libsqlite3-sys 0.38 cfg_select!) require a recent stable
authors = ["Guy"]
repository = "https://github.com/guycorbaz/steadyinvest"

[workspace.dependencies]
# ── Internal crates (version pinned so they are not wildcard deps) ──
steadyinvest-core = { path = "core", version = "0.1.0" }
steadyinvest-contract = { path = "contract", version = "0.1.0" }
steadyinvest-ingestion = { path = "ingestion", version = "0.1.0" }
steadyinvest-persistence = { path = "persistence", version = "0.1.0" }
steadyinvest-report = { path = "report", version = "0.1.0" }

# ── External (pinned; latest stable verified 2026-06) ──
slint = "1.16"
slint-build = "1.16"
rusqlite = { version = "0.40", features = ["bundled"] }       # SQLite compiled into the binary
rust_decimal = { version = "1.42", features = ["maths"] }     # exact decimal + powd/exp/ln (no f64)
# reqwest TLS backend deferred to Story 3.1 (first HTTP). In 0.13 the rustls feature pulls aws-lc-rs
# (needs cmake); the locked posture is still pure-Rust rustls — activated when HTTP actually lands.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
tracing = "0.1"
# NOTE: `keyring` is intentionally NOT pinned here yet. The crates.io `keyring` 4.0.x is NOT the
# expected credential library (it pulls a turso/tantivy/dbus keystore stack). The OS-keychain crate
# is selected & added in Story 3.2 (see GitHub issue). Architecture's "keyring 4.0" pin needs revalidation.
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
# RFC3339 UTC wall clock for the app's injected `Clock` (ADD15). `clock` feature only — no civil
# math is hand-rolled. Already in the lock tree transitively via Slint (default-features off keeps
# the edge minimal: the `clock` feature's deps — incl. iana-time-zone — are already present), so
# adding it to `app` is a single new edge, no new crates. MIT/Apache (already in deny.toml allow).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.11"
# Dev-only (persistence tests): test DBs land in /tmp, outside the Synology Drive sync watch.
tempfile = "3"
# Clipboard read — used ONLY by the throwaway Story-1.4 grid spike (paste-a-column). Text-only
# (`default-features = false` drops image-data deps) to keep the tree lean. deny.toml already allows
# its Windows backend's BSL-1.0 (clipboard-win). Not a shipping dependency.
arboard = { version = "3", default-features = false }

# Build artifacts are smaller/faster to ship for a desktop app.
[profile.release]
lto = "thin"
strip = true
